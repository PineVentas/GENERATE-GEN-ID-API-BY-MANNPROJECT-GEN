name: Diagnostico 2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Arrancar servidor
        run: |
          nohup python wsgi.py > server.log 2>&1 &
          sleep 8
          curl -s -o /dev/null http://127.0.0.1:5000/api/health

      - name: Sonda US individual
        run: |
          set +e
          echo "== US count=1 =="
          curl -s --max-time 200 -w "\nHTTP:%{http_code}\n" \
            "http://127.0.0.1:5000/api/v1/gen?region=US&count=1&debug=1"

      - name: Sonda US lote
        run: |
          set +e
          echo "== US count=5 =="
          curl -s --max-time 200 -w "\nHTTP:%{http_code}\n" \
            "http://127.0.0.1:5000/api/v1/gen?region=US&count=5&debug=1"

      - name: Log servidor
        if: always()
        run: cat server.log
