name: Gen US

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Cuantas cuentas US"
        default: "5"
        type: string
      prefix:
        description: "Prefijo"
        default: "PIP"
        type: string
      workers:
        description: "Concurrencia (2 al principio)"
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COUNT: ${{ inputs.count || '5' }}
      NAME_PREFIX: ${{ inputs.prefix || 'PIP' }}
      WORKERS: ${{ inputs.workers || '2' }}
      REGION: SAC
      LOCK_FIELD: "4"
      TIMEOUT: "20"
      RETRIES: "3"
      OUT_FILE: accounts_us.txt
      PYTHONUNBUFFERED: "1"
      PROXY: ${{ secrets.PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar
        run: python gen_us.py
      - name: Resumen
        if: always()
        run: |
          if [ -s "$OUT_FILE" ]; then
            { echo "### US: $(wc -l < "$OUT_FILE")"; echo '```'; cat "$OUT_FILE"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin cuentas. Ver fallos por paso en el log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-us-${{ github.run_number }}
          path: accounts_us.txt
          if-no-files-found: warn
          retention-days: 14
