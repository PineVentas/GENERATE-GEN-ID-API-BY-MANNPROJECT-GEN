- name: Generar cuentas
        run: |
          mkdir -p datos
          [ -s datos/cuentas_us.json ] || echo "[]" > datos/cuentas_us.json
          for i in 1 2 3; do
            echo "--- tanda $i ---"
            curl -s --max-time 200 \
              "http://127.0.0.1:5000/api/v1/gen?region=US&count=10&name=PIP&debug=1" \
              -o tmp.json
            echo "HTTP:$(wc -c < tmp.json) bytes"
            cat tmp.json; echo
            jq --slurpfile n tmp.json '. + ($n[0].accounts // [])' \
              datos/cuentas_us.json > merged.json 2>/dev/null \
              && mv merged.json datos/cuentas_us.json
            n=$(jq 'length' datos/cuentas_us.json)
            echo "acumulado: $n"
            [ "$n" -ge 10 ] && break
          done
          jq 'unique_by(.uid)' datos/cuentas_us.json > d.json && mv d.json datos/cuentas_us.json
